name: Allora mobile apps

# Rebuilds the Android and iOS apps whenever the web app or the mobile wrapper
# changes, so the three never drift apart. Download the results from the run's
# "Artifacts" section; builds from main also publish the APK as a release.

on:
  push:
    branches: [main]
    paths:
      - 'cils-app/**'
      - 'cils-mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'cils-app/**'
      - 'cils-mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the APK as a release from main
    defaults:
      run:
        working-directory: cils-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cils-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Copy the web app into the Android project
        run: npm run sync:android
      - name: Build the APK
        working-directory: cils-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: allora-android-debug
          path: cils-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Builds from main replace the "android-latest" release, so this link
      # always downloads the newest APK, with no GitHub sign-in needed:
      # https://github.com/dvmadhumitha/PM-Side-Projects/releases/latest/download/Allora.apk
      - name: Publish the APK as the latest release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Allora.apk
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-latest Allora.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Allora for Android (test build)" \
            --notes "Newest test build of Allora, made from main on $(date -u '+%d %b %Y'). On an Android phone, tap Allora.apk below to download it, then open the file to install."

  ios:
    name: iOS (simulator build)
    # Capacitor 8 needs a current Xcode; bump this label when GitHub retires it.
    runs-on: macos-26
    defaults:
      run:
        working-directory: cils-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cils-mobile/package-lock.json
      - run: npm ci
      - name: Copy the web app into the iOS project and install pods
        run: npm run sync:ios
      - name: Build for the iPhone simulator (no signing needed)
        working-directory: cils-mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package the simulator app
        working-directory: cils-mobile/ios/App/build/Build/Products/Debug-iphonesimulator
        run: zip -r "$GITHUB_WORKSPACE/allora-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: allora-ios-simulator
          path: allora-ios-simulator.zip
          if-no-files-found: error
